<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touch Grass You Chud!</title>
    <style>
      @font-face {
        font-family: "SIGMAFONT";
        src: url("assets/OP FONT.otf");
      }
      * {
        font-family: "SIGMAFONT", sans-serif;
      }
      #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #loadingScreen button {
        padding: 10px 20px;
        font-size: 44px;
        cursor: pointer;
      }
      #verity {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 10rem;
        height: 10rem;
      }
      #objective-div {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.1);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 10000;
      }
      #objective-text {
        width: 1150px;
        font-size: 33px;
        margin: 0;
        color: red;
        --webkit-text-stroke: 0.5rem black;
      }
      #before {
        position: absolute;

        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        z-index: -67;
        filter: contrast(1.5) brightness(0.2);
      }
      #datingScreen {
        image-rendering: pixelated;

        width: 75%;
        height: 75%;
        position: absolute;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        z-index: 676767;
      }
      #sc {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -676767;
        filter: contrast(1) brightness(0.5);
      }
      #tripleC {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: 76767;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      #backdrop {
        position: fixed;
        top:0;
        left:0;
        width: 100%;
        height: 100%;
        z-index: 76767;
        background-color: rgb(0, 0, 0);
        color: rgba(0, 0, 0, 0);
        font-size: 50px;
        justify-content: center;
        align-items: center;
        background-image: url("./assets/grass.png");
      }

      #backdrop2 {
        position: fixed;
         top:0;
        left:0;
        background-color: white;
        color: transparent;
        user-select: none;
        width: 100%;
        height: 100%;
        z-index: 76767;
        font-size: 50px;
        justify-content: center;
        align-items: center;
        background-image: url("./assets/valorantFlashImage.webp");
        background-repeat: no-repeat;
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div id="winScreen">
      <h1>YOU WON!!!</h1>
      <br>
      <button>Restart!</button>
    </div>
    <div id="backdrop" hidden>a</div>
    <div id="backdrop2" hidden>a</div>
    <div id="objective-div" hidden>
      <p id="objective-text">
        You got rejected by your ai girlfriend 💀😭. She said "go touch grass"
        and left you alone.
      </p>
    </div>
    <div id="loadingScreen">
      <img id="sc" src="./assets/rblxScreenshot.png" alt="Loading..." />
      <button id="buttonCool">become a chud</button>
      <img
        title="yes i got secret footage of paya singing lol. click this 67 times. find out what happens!"
        hidden
        id="verity"
        src="./assets/verity.gif"
      />
      <img hidden src="./assets/tripleC.png" id="tripleC" alt="tripleC" />
    </div>
    <img
      hidden="true"
      id="datingScreen"
      src="./assets/datingScreen.png"
      alt="datingScreen"
    />
    <script src="main.js" type="module"></script>
  </body>
</html>
