<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Touch Grass Chud!</title>
    <style>
      @font-face {
        font-family: "SIGMAFONT";
        src: url("assets/OP FONT.otf");
      }
      * {
        font-family: "SIGMAFONT", sans-serif;
      }
      #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }
      #loadingScreen button {
        padding: 10px 20px;
        font-size: 44px;
        cursor: pointer;
      }
      #verity {
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 10rem;
        height: 10rem;
      }
      #objective-div {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 10000;
      }
      #objective-text {
        font-size: 24px;
        margin: 0;
        color: red;
      }
      #before {
        position: absolute;

        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        z-index:-67;
        filter: contrast(1.5) brightness(0.2);
      }
    </style>
  </head>
  <body>
    <div id="objective-div" hidden>
      <p id="objective-text">OBJECTIVE: Go to door</p>
    </div>
    <div id="loadingScreen">
      <button id="buttonCool">ENTER</button>
      <img hidden id="verity" src="./assets/verity.gif" />
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
